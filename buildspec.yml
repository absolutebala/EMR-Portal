version: 0.2

env:
  variables:
    ECS_CLUSTER: emr-portal
    ECS_SERVICE: emr-portal
    ECS_CONTAINER_NAME: emr-portal
    ECS_TASK_FAMILY: emr-portal

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-40)
      - IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  build:
    commands:
      - >
        docker build
        --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="$NEXT_PUBLIC_VAPID_PUBLIC_KEY"
        --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL"
        -t $IMAGE_URI .

  post_build:
    commands:
      - docker push $IMAGE_URI
      - |
        if ! aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
          echo "ECS service not deployed yet — image pushed to ECR, skipping service update."
          exit 0
        fi

        aws ecs describe-task-definition --task-definition $ECS_TASK_FAMILY \
          --query 'taskDefinition' > task-def.json

        NEW_TASK_DEF=$(jq --arg IMAGE "$IMAGE_URI" --arg NAME "$ECS_CONTAINER_NAME" \
          '.containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end) |
           del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
          task-def.json)

        NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json "$NEW_TASK_DEF" \
          --query 'taskDefinition.taskDefinitionArn' --output text)

        aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE \
          --task-definition $NEW_TASK_DEF_ARN --force-new-deployment
